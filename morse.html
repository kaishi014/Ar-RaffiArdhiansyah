<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter & Suara Kode Morse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #ff9800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            transition: background-color 0.3s;
        }
        button:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        button.wa-btn {
            background-color: #25D366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #bbb;
            text-align: center;
        }
        .warning-note {
            margin-top: 10px;
            font-size: 13px;
            color: #ffeb3b;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="startBtn" onclick="mulaiHitungMundur()">Mulai Kirim Morse</button>
    <div id="status">Klik tombol untuk memulai</div>
    <div class="warning-note"> Pastikan volume media HP Anda dalam keadaan aktif/maksimal.</div>

    <script>
        const PESAN_MORSE = "-- . -. ..- .--- ..-  .-.. .- .--. .- -. --. .- -.  .- -.- .- .-. .-- .- -. --. .."; 
        
        // Kecepatan Tingkat Purwa (Pemula):
        // Unit waktu diperlambat menjadi 300 ms (default normal biasanya 100 - 150 ms)
        const UNIT_TIME = 300; 

        // Ganti nomor WhatsApp Anda (Gunakan kode negara, contoh: 6281234567890)
        const NOMOR_WA = "6281234567890"; 
        const TEKS_WA = encodeURIComponent("Halo kakk arraffi ganteng, saya ingin menanyakan/mengulang pesan Morse yang dikirim tadi.");

        let track = null;
        let sudahSelesai = false;
        let audioCtx = null;

        async function inisialisasiSenter() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                track = stream.getVideoTracks()[0];
                return true;
            } catch (err) {
                alert("Gagal mengakses kamera/senter: " + err.message);
                return false;
            }
        }

        // Fungsi Audio Synthesizer (Sinyal Suara Bip)
        function playTone(duration) {
            return new Promise(resolve => {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime); // Frekuensi nada 600Hz (nada standar morse)
                
                // Set volume internal Web Audio ke 100% (Maksimal)
                gain.gain.setValueAtTime(1.0, audioCtx.currentTime); 

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                setTimeout(() => {
                    osc.stop();
                    resolve();
                }, duration);
            });
        }

        async function setSenter(status) {
            if (track) {
                try {
                    await track.applyConstraints({
                        advanced: [{ torch: status }]
                    });
                } catch (e) {
                    console.error("Fitur torch tidak didukung:", e);
                }
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function mulaiHitungMundur() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            // Jika sudah pernah diklik 1x, arahkan langsung ke WhatsApp
            if (sudahSelesai) {
                window.location.href = `https://wa.me/${NOMOR_WA}?text=${TEKS_WA}`;
                return;
            }

            btn.disabled = true;
            statusDiv.innerText = "Meminta izin senter & audio...";

            // Mengaktifkan AudioContext saat ada gesture/klik pengguna
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!track) {
                const berhasil = await inisialisasiSenter();
                if (!berhasil) {
                    btn.disabled = false;
                    statusDiv.innerText = "Senter tidak tersedia.";
                    return;
                }
            }

            // Hitung Mundur 3 Detik
            let hitung = 3;
            statusDiv.innerText = `Senter & Suara akan menyala dalam ${hitung}...`;

            const timer = setInterval(async () => {
                hitung--;
                if (hitung > 0) {
                    statusDiv.innerText = `Senter & Suara akan menyala dalam ${hitung}...`;
                } else {
                    clearInterval(timer);
                    await kirimMorse();
                }
            }, 1000);
        }

        async function kirimMorse() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            statusDiv.innerText = "Mengirim sinyal: " ;

            for (let i = 0; i < PESAN_MORSE.length; i++) {
                const char = PESAN_MORSE[i];

                if (char === '.') {
                    // Titik (Dot): Senter dan Suara aktif bersamaan selama 1 unit
                    setSenter(true);
                    await playTone(UNIT_TIME);
                    setSenter(false);
                    await delay(UNIT_TIME); // Jeda antar simbol
                } else if (char === '-') {
                    // Strip (Dash): Senter dan Suara aktif bersamaan selama 3 unit
                    setSenter(true);
                    await playTone(UNIT_TIME * 3);
                    setSenter(false);
                    await delay(UNIT_TIME); // Jeda antar simbol
                } else if (char === ' ') {
                    // Spasi antar kata/huruf
                    await delay(UNIT_TIME * 3);
                }
            }

            await setSenter(false);
            sudahSelesai = true; // Kunci akses percobaan

            // Ubah tampilan menjadi tombol WhatsApp
            statusDiv.innerText = "Sinyal selesai dikirim! Percobaan telah habis.";
            btn.innerText = "Tanya / Mengulang via WhatsApp";
            btn.classList.add("wa-btn");
            btn.disabled = false;
        }
    </script>
</body>
</html>
