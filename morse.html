<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter Kode Morse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #ff9800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            transition: background-color 0.3s;
        }
        button:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        button.wa-btn {
            background-color: #25D366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #bbb;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="startBtn" onclick="mulaiHitungMundur()">Mulai Kirim Morse</button>
    <div id="status">Klik tombol untuk memulai</div>

    <script>
        const PESAN_MORSE = "... --- ..."; 
        const UNIT_TIME = 200; 

        // Ganti nomor WhatsApp di bawah ini (gunakan format kode negara, misal: 6281234567890)
        const NOMOR_WA = "6283878085393"; 
        const TEKS_WA = encodeURIComponent("Halo ka raffi ganteng, saya ingin menanyakan/mengulang pesan Morse yang dikirim tadi.");

        let track = null;
        let sudahSelesai = false;

        async function inisialisasiSenter() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                track = stream.getVideoTracks()[0];
                return true;
            } catch (err) {
                alert("Gagal mengakses kamera/senter: " + err.message);
                return false;
            }
        }

        async function setSenter(status) {
            if (track) {
                try {
                    await track.applyConstraints({
                        advanced: [{ torch: status }]
                    });
                } catch (e) {
                    console.error("Fitur torch tidak didukung:", e);
                }
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function mulaiHitungMundur() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            // Jika sudah selesai 1x, arahkan langsung ke WhatsApp jika diklik lagi
            if (sudahSelesai) {
                window.location.href = `https://wa.me/${NOMOR_WA}?text=${TEKS_WA}`;
                return;
            }

            btn.disabled = true;
            statusDiv.innerText = "Meminta izin senter...";

            if (!track) {
                const berhasil = await inisialisasiSenter();
                if (!berhasil) {
                    btn.disabled = false;
                    statusDiv.innerText = "Senter tidak tersedia.";
                    return;
                }
            }

            // Hitung Mundur 3 Detik
            let hitung = 3;
            statusDiv.innerText = `Senter akan menyala dalam ${hitung}...`;

            const timer = setInterval(async () => {
                hitung--;
                if (hitung > 0) {
                    statusDiv.innerText = `Senter akan menyala dalam ${hitung}...`;
                } else {
                    clearInterval(timer);
                    await kirimMorse();
                }
            }, 1000);
        }

        async function kirimMorse() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            statusDiv.innerText = "Mengirim pesan: ";

            for (let i = 0; i < PESAN_MORSE.length; i++) {
                const char = PESAN_MORSE[i];

                if (char === '.') {
                    await setSenter(true);
                    await delay(UNIT_TIME);
                    await setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === '-') {
                    await setSenter(true);
                    await delay(UNIT_TIME * 3);
                    await setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === ' ') {
                    await delay(UNIT_TIME * 3);
                }
            }

            await setSenter(false);
            sudahSelesai = true; // Kunci agar tidak bisa diulang

            // Ubah tombol menjadi tombol WhatsApp
            statusDiv.innerText = "Pesan selesai dikirim! Percobaan telah habis.";
            btn.innerText = "Tanya / Mengulang via WhatsApp";
            btn.classList.add("wa-btn");
            btn.disabled = false;
        }
    </script>
</body>
</html>
