<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter Kode Morse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #ff9800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
        }
        button:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <button id="startBtn" onclick="mulaiHitungMundur()">Mulai Kirim Morse</button>
    <div id="status">Klik tombol untuk memulai</div>

    <script>
        const PESAN_MORSE = "... --- ..."; 
        const UNIT_TIME = 200; 

        let track = null;
        let jumlahSelesai = 0; // Penanda berapa kali proses sudah dijalankan

        async function inisialisasiSenter() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                track = stream.getVideoTracks()[0];
                return true;
            } catch (err) {
                alert("Gagal mengakses kamera/senter: " + err.message);
                return false;
            }
        }

        async function setSenter(status) {
            if (track) {
                try {
                    await track.applyConstraints({
                        advanced: [{ torch: status }]
                    });
                } catch (e) {
                    console.error("Fitur torch tidak didukung:", e);
                }
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function mulaiHitungMundur() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            // Cek jika sudah pernah dijalankan 2 kali (awal + 1x ulang)
            if (jumlahSelesai >= 2) {
                statusDiv.innerText = "Batas pengulangan sudah habis!";
                btn.disabled = true;
                return;
            }

            btn.disabled = true;
            statusDiv.innerText = "Meminta izin senter...";

            if (!track) {
                const berhasil = await inisialisasiSenter();
                if (!berhasil) {
                    btn.disabled = false;
                    statusDiv.innerText = "Senter tidak tersedia.";
                    return;
                }
            }

            // Hitung Mundur 3 Detik
            let hitung = 3;
            statusDiv.innerText = `Senter akan menyala dalam ${hitung}...`;

            const timer = setInterval(async () => {
                hitung--;
                if (hitung > 0) {
                    statusDiv.innerText = `Senter akan menyala dalam ${hitung}...`;
                } else {
                    clearInterval(timer);
                    await kirimMorse();
                }
            }, 1000);
        }

        async function kirimMorse() {
            const btn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            statusDiv.innerText = "Mengirim pesan: " + PESAN_MORSE;

            for (let i = 0; i < PESAN_MORSE.length; i++) {
                const char = PESAN_MORSE[i];

                if (char === '.') {
                    await setSenter(true);
                    await delay(UNIT_TIME);
                    await setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === '-') {
                    await setSenter(true);
                    await delay(UNIT_TIME * 3);
                    await setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === ' ') {
                    await delay(UNIT_TIME * 3);
                }
            }

            await setSenter(false);
            jumlahSelesai++; // Menambah hitungan penggunaan

            if (jumlahSelesai === 1) {
                statusDiv.innerText = "Pesan selesai! Anda memiliki 1 kali kesempatan mengulang.";
                btn.innerText = "Ulangi Kirim Morse";
                btn.disabled = false;
            } else {
                statusDiv.innerText = "Pesan selesai! Batas pengulangan telah habis.";
                btn.innerText = "Selesai";
                btn.disabled = true; // Tombol terkunci permanen
            }
        }
    </script>
</body>
</html>
