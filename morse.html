<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senter & Suara Kode Morse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #startBtn {
            background-color: #ff9800;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
        }
        #waBtn {
            background-color: #25D366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            display: none; /* Sembunyi secara default */
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #bbb;
            text-align: center;
        }
        .warning-note {
            margin-top: 10px;
            font-size: 13px;
            color: #ffeb3b;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tombol Utama Mulai -->
    <button id="startBtn" onclick="mulaiProses()">Mulai Kirim Morse</button>
    
    <!-- Tombol WhatsApp (Awalnya tersembunyi) -->
    <button id="waBtn" onclick="bukaWhatsApp()">Tanya / Mengulang via WhatsApp</button>

    <div id="status">Klik tombol untuk memulai</div>
    <div id="warningNote" class="warning-note">Pastikan volume media HP Anda dalam keadaan aktif/maksimal.</div>

    <script>
        const PESAN_MORSE = "-- . _. ..- .--- ..-  .-.. .- .--. .- -. --. .- -.  ... .- -- -... .. .-.. --- - ---"; 
        const UNIT_TIME = 300; // Kecepatan tingkat Purwa (Pemula)

        // Ganti nomor WhatsApp Anda (Format internasional: 628xxxxxxx)
        const NOMOR_WA = "6283878085393"; 
        const TEKS_WA = encodeURIComponent("Halo kak arraffi ganteng, saya ingin menanyakan/mengulang pesan Morse yang dikirim tadi.");

        let track = null;
        let audioCtx = null;

        async function inisialisasiSenter() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                track = stream.getVideoTracks()[0];
                return true;
            } catch (err) {
                alert("Gagal mengakses kamera/senter: " + err.message);
                return false;
            }
        }

        function playTone(duration) {
            return new Promise(resolve => {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(1.0, audioCtx.currentTime); 

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                setTimeout(() => {
                    osc.stop();
                    resolve();
                }, duration);
            });
        }

        async function setSenter(status) {
            if (track) {
                try {
                    await track.applyConstraints({
                        advanced: [{ torch: status }]
                    });
                } catch (e) {
                    console.error("Fitur torch tidak didukung:", e);
                }
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function mulaiProses() {
            const startBtn = document.getElementById("startBtn");
            const statusDiv = document.getElementById("status");

            // 1. Langsung hilangkan tombol "Mulai Kirim Morse"
            startBtn.style.display = "none";
            document.getElementById("warningNote").style.display = "none";
            
            statusDiv.innerText = "Meminta izin senter & audio...";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!track) {
                const berhasil = await inisialisasiSenter();
                if (!berhasil) {
                    statusDiv.innerText = "Senter tidak tersedia.";
                    return;
                }
            }

            // 2. Hitung Mundur 3 Detik
            let hitung = 3;
            statusDiv.innerText = `Senter & Suara akan menyala dalam ${hitung}...`;

            const timer = setInterval(async () => {
                hitung--;
                if (hitung > 0) {
                    statusDiv.innerText = `Senter & Suara akan menyala dalam ${hitung}...`;
                } else {
                    clearInterval(timer);
                    await kirimMorse();
                }
            }, 1000);
        }

        async function kirimMorse() {
            const statusDiv = document.getElementById("status");
            const waBtn = document.getElementById("waBtn");

            statusDiv.innerText = "Mengirim sinyal: " + PESAN_MORSE;

            for (let i = 0; i < PESAN_MORSE.length; i++) {
                const char = PESAN_MORSE[i];

                if (char === '.') {
                    setSenter(true);
                    await playTone(UNIT_TIME);
                    setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === '-') {
                    setSenter(true);
                    await playTone(UNIT_TIME * 3);
                    setSenter(false);
                    await delay(UNIT_TIME);
                } else if (char === ' ') {
                    await delay(UNIT_TIME * 3);
                }
            }

            await setSenter(false);

            // 3. Sinyal selesai -> Munculkan pesan selesai & Tombol WhatsApp
            statusDiv.innerText = "Sinyal selesai dikirim! Percobaan telah habis.";
            waBtn.style.display = "inline-block";
        }

        function bukaWhatsApp() {
            window.location.href = `https://wa.me/${NOMOR_WA}?text=${TEKS_WA}`;
        }
    </script>
</body>
</html>
