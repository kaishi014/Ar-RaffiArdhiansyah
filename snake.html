<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Snake Classic</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        canvas {
            border: 4px solid #4CAF50;
            background-color: #000000;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            border-radius: 8px;
        }

        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="score-board">Skor: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls-info">Gunakan tombol panah (⬆️ ⬇️ ⬅️ ➡️) untuk bergerak</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval;
    let gameStarted = false;

    document.addEventListener("keydown", changeDirection);

    function main() {
        if (hasGameEnded()) {
            alert(`Game Over! Skor Akhir Kamu: ${score}`);
            resetGame();
            return;
        }

        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        // Cek jika ular memakan makanan
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.innerText = score;
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        // Pastikan makanan tidak muncul di tubuh ular
        snake.forEach(part => {
            if (part.x === food.x && part.y === food.y) {
                generateFood();
            }
        });
    }

    function drawFood() {
        ctx.fillStyle = "#FF5252";
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function changeDirection(event) {
        const keyPressed = event.keyCode;
        const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

        // Jalankan game saat tombol pertama kali ditekan
        if (!gameStarted) {
            gameStarted = true;
            gameInterval = setInterval(main, 100);
        }

        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (keyPressed === LEFT && !goingRight) { dx = -1; dy = 0; }
        if (keyPressed === UP && !goingDown) { dx = 0; dy = -1; }
        if (keyPressed === RIGHT && !goingLeft) { dx = 1; dy = 0; }
        if (keyPressed === DOWN && !goingUp) { dx = 0; dy = 1; }
    }

    function hasGameEnded() {
        // Tabrakan dengan tubuh sendiri
        for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
        }

        // Tabrakan dengan dinding
        const hitLeftWall = snake[0].x < 0;
        const hitRightWall = snake[0].x >= tileCount;
        const hitToptWall = snake[0].y < 0;
        const hitBottomWall = snake[0].y >= tileCount;

        return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
    }

    function resetGame() {
        clearInterval(gameInterval);
        snake = [{ x: 10, y: 10 }];
        food = { x: 15, y: 15 };
        dx = 0;
        dy = 0;
        score = 0;
        scoreElement.innerText = score;
        gameStarted = false;
        clearCanvas();
        drawFood();
        drawSnake();
    }

    // Tampilan awal
    drawFood();
    drawSnake();
</script>

</body>
</html>
