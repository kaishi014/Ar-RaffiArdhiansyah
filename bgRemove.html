<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapus Background Foto Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        header p {
            color: #7f8c8d;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        .api-section {
            margin-bottom: 20px;
            text-align: left;
            background: #fff8e1;
            padding: 15px;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
        }

        .api-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .api-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            cursor: pointer;
            transition: background 0.3s ease;
            background: #f8fbfe;
        }

        .upload-area:hover {
            background: #eef6fc;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
        }

        .status {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #e67e22;
            display: none;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .preview-box {
            flex: 1;
            min-width: 280px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        .preview-box h3 {
            margin-bottom: 12px;
            color: #34495e;
            font-size: 1rem;
        }

        .img-wrapper {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            overflow: hidden;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%), 
                              linear-gradient(-45deg, #eee 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #eee 75%), 
                              linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .download-btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

    <header>
        <h1>Pengubah Background Foto</h1>
        <p>Hapus latar belakang gambar secara instan.</p>
    </header>

    <div class="container">
        <!-- Input API Key -->
        <div class="api-section">
            <label for="apiKeyInput">API Key Remove.bg:</label>
            <input type="password" id="apiKeyInput" placeholder="Masukkan API Key Remove.bg Anda di sini">
        </div>

        <div class="upload-area" id="uploadArea">
            <p>Tarik & Lepas gambar di sini, atau</p>
            <span class="upload-btn">Pilih Gambar</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="status" id="statusText">Sedang memproses gambar... Mohon tunggu.</div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <div class="preview-box">
                <h3>Gambar Asli</h3>
                <div class="img-wrapper">
                    <img id="originalImage" alt="Original">
                </div>
            </div>
            <div class="preview-box">
                <h3>Hasil (Tanpa Background)</h3>
                <div class="img-wrapper">
                    <img id="resultImage" alt="Result">
                </div>
                <a id="downloadBtn" class="download-btn" download="hasil-no-bg.png">Unduh Hasil</a>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const statusText = document.getElementById('statusText');
        const previewContainer = document.getElementById('previewContainer');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processImage(file);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#eef6fc';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '#f8fbfe';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f8fbfe';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processImage(file);
            }
        });

        async function processImage(file) {
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                alert('Silakan masukkan API Key Remove.bg terlebih dahulu!');
                return;
            }

            // Tampilkan gambar asli
            const originalUrl = URL.createObjectURL(file);
            originalImage.src = originalUrl;

            // Status loading
            statusText.style.color = '#e67e22';
            statusText.textContent = 'Sedang memproses gambar... Mohon tunggu.';
            statusText.style.display = 'block';
            previewContainer.style.display = 'none';

            // Kirim request ke API Remove.bg
            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': apiKey
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Gagal memproses. Pastikan API Key benar.');
                }

                const blob = await response.blob();
                const resultUrl = URL.createObjectURL(blob);

                // Tampilkan hasil
                resultImage.src = resultUrl;
                downloadBtn.href = resultUrl;

                statusText.style.display = 'none';
                previewContainer.style.display = 'flex';
            } catch (error) {
                console.error(error);
                statusText.style.color = '#e74c3c';
                statusText.textContent = error.message || 'Terjadi kesalahan saat mengolah gambar.';
            }
        }
    </script>
</body>
</html>
