<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ekstrakurikuler Pramuka</title>
  <!-- Font Awesome untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-top: 6px solid #5c3a21; /* Warna khas Cokelat Pramuka */
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header i {
      font-size: 40px;
      color: #5c3a21;
      margin-bottom: 10px;
    }

    .header h2 {
      color: #5c3a21;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #5c3a21;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      background-color: #25d366; /* Warna WhatsApp */
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s;
    }

    .btn-submit:hover {
      background-color: #1eb954;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <i class="fa-solid fa-campground"></i>
      <h2>Pendaftaran Eskul Pramuka</h2>
      <p>Isi data diri di bawah ini untuk bergabung!</p>
    </div>

    <!-- FORMULIR PENDAFTARAN -->
    <form id="pramukaForm">
      <div class="form-group">
        <label for="namaLengkap">Nama Lengkap</label>
        <input type="text" id="namaLengkap" placeholder="Masukkan nama lengkap" required>
      </div>

      <div class="form-group">
        <label for="namaPanggilan">Nama Panggilan</label>
        <input type="text" id="namaPanggilan" placeholder="Masukkan nama panggilan" required>
      </div>

      <div class="form-group">
        <label for="kelas">Kelas</label>
        <input type="text" id="kelas" placeholder="Contoh: X IPA 1 / 7B" required>
      </div>

      <div class="form-group">
        <label for="alasan">Alasan Masuk Pramuka</label>
        <textarea id="alasan" placeholder="Tuliskan alasan kamu ingin bergabung..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-brands fa-whatsapp"></i> Kirim via WhatsApp
      </button>
    </form>
  </div>

  <!-- JAVASCRIPT FIX & OPTIMIZATION -->
  <script>
    document.getElementById('pramukaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // =========================================================
      // 1. MASUKKAN NOMOR HP KAMU DI SINI
      // Bisa ditulis "08123456789" atau "628123456789" (Otomatis dikonversi)
      // =========================================================
      let nomorWA = "083878085393"; 

      // Pembersihan format nomor (otomatis ganti 0 diawal jadi 62 dan hapus simbol)
      nomorWA = nomorWA.replace(/[^0-9]/g, '');
      if (nomorWA.startsWith('0')) {
        nomorWA = '62' + nomorWA.slice(1);
      }

      // 2. Ambil nilai input dari form
      const namaLengkap = document.getElementById('namaLengkap').value.trim();
      const namaPanggilan = document.getElementById('namaPanggilan').value.trim();
      const kelas = document.getElementById('kelas').value.trim();
      const alasan = document.getElementById('alasan').value.trim();

      // 3. Waktu Otomatis (Format Indonesia)
      const sekarang = new Date();
      
      const opsiTanggal = { 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
      };
      const tanggalFormatted = sekarang.toLocaleDateString('id-ID', opsiTanggal);

      const jamFormatted = sekarang.toLocaleTimeString('id-ID', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false
      }).replace('.', ':') + ' WIB';

      const waktuKirim = `${tanggalFormatted} - Pukul ${jamFormatted}`;

      // 4. Menyusun Teks Pesan WhatsApp
      const pesan = `Halo Kakak Pramuka,\n\n` +
                    `Saya ingin mendaftar Ekstrakurikuler Pramuka dengan data sebagai berikut:\n\n` +
                    `- *Nama Lengkap:* ${namaLengkap}\n` +
                    `- *Nama Panggilan:* ${namaPanggilan}\n` +
                    `- *Kelas:* ${kelas}\n` +
                    `- *Alasan Masuk:* ${alasan}\n\n` +
                    `- *Waktu Pendaftaran:* ${waktuKirim}\n` +
                    `Mohon dapat diproses. Terima kasih!`;

      // 5. Buka WhatsApp Direct Link
      const urlWA = `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;
      window.open(urlWA, '_blank');
    });
  </script>

</body>
</html>
