<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaishi014 AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --user-msg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --bot-msg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 24px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-bot {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: white;
    }

    .header-info h2 { font-size: 1.1rem; font-weight: 700; }
    .header-info p { font-size: 0.8rem; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .header-info p::before { content: ''; width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }

    .key-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .key-btn:hover { color: var(--text-main); border-color: var(--accent-color); }

    .chat-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: var(--bot-msg);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .chat-input-container {
      padding: 16px 24px 24px;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 6px 8px 6px 18px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    button.send-btn {
      width: 42px;
      height: 42px;
      border: none;
      background: var(--accent-color);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal API Key */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e293b;
      padding: 32px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-card h3 { margin-bottom: 12px; font-size: 1.3rem; }
    .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
    
    .modal-input-wrapper {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <!-- Modal Halaman Input API Key -->
  <div class="modal-overlay" id="apiModal">
    <div class="modal-card">
      <div class="avatar-bot" style="margin: 0 auto 16px;"><i class="fa-solid fa-key"></i></div>
      <h3>Masukkan API Key Gemini</h3>
      <p>API Key diperlukan agar AI dapat merespon. Kunci ini disimpan secara lokal di browser Anda.</p>
      
      <div class="modal-input-wrapper">
        <input type="password" id="apiKeyInput" placeholder="Tempel API Key (AIzaSy...)" style="width: 100%;">
      </div>

      <button class="save-btn" onclick="saveApiKey()">Simpan & Mulai Chat</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="header-left">
        <div class="avatar-bot"><i class="fa-solid fa-robot"></i></div>
        <div class="header-info">
          <h2>Kaishi014 AI</h2>
          <p>Online</p>
        </div>
      </div>
      <button class="key-btn" onclick="resetApiKey()"><i class="fa-solid fa-gear"></i> Ubah Key</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">Halo! Saya Kaishi014 AI. Ada yang bisa saya bantu hari ini?</div>
    </div>

    <div class="chat-input-container">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ketik pesan Anda..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    let API_KEY = localStorage.getItem("GEMINI_API_KEY") || "";
    const MODEL_NAME = "gemini-3.6-flash";

    // Cek keberadaan API Key saat pertama kali dimuat
    window.onload = function() {
      if (!API_KEY) {
        document.getElementById("apiModal").style.display = "flex";
      } else {
        document.getElementById("apiModal").style.display = "none";
      }
    };

    function saveApiKey() {
      const keyVal = document.getElementById("apiKeyInput").value.trim();
      if (keyVal) {
        API_KEY = keyVal;
        localStorage.setItem("GEMINI_API_KEY", keyVal);
        document.getElementById("apiModal").style.display = "none";
      } else {
        alert("Silakan masukkan API Key yang valid!");
      }
    }

    function resetApiKey() {
      document.getElementById("apiKeyInput").value = API_KEY;
      document.getElementById("apiModal").style.display = "flex";
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const userMessage = input.value.trim();

      if (!userMessage) return;

      if (!API_KEY) {
        document.getElementById("apiModal").style.display = "flex";
        return;
      }

      appendMessage(userMessage, "user");
      input.value = "";

      const loadingDiv = appendMessage("", "bot");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:streamGenerateContent?key=${API_KEY}&alt=sse`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userMessage }] }]
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          loadingDiv.innerText = `Error: ${errData.error?.message || 'Gagal terhubung ke API'}`;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const jsonStr = line.replace("data: ", "").trim();
              if (jsonStr === "[DONE]") continue;

              try {
                const parsed = JSON.parse(jsonStr);
                const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
                loadingDiv.innerText += textChunk;
                
                const chatBox = document.getElementById("chatBox");
                chatBox.scrollTop = chatBox.scrollHeight;
              } catch (e) {}
            }
          }
        }
      } catch (error) {
        console.error("Network Error:", error);
        loadingDiv.innerText = "Gagal terhubung. Pastikan koneksi internet aktif dan API Key benar.";
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>
</body>
</html>
